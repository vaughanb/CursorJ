# Prepended to the agent payload in Plan mode only (not shown as the user message bubble).
chat.plan.promptPrefix=Plan mode: If anything is ambiguous, under-specified, or could be done in multiple reasonable ways, stop and ask the user questions before you propose a detailed plan or lock in design choices. When helpful, list concrete options (A/B/…) and tradeoffs. Do not silently pick defaults or assume answers—wait for the user's reply. Only after the user answers should you finalize or refine the implementation plan.
# Prepended in Debug mode only (not shown as the user message bubble). {0}=log file path, {1}=HTTP POST URL or fallback hint.
chat.debug.promptPrefix=Debug mode: Investigate this bug using runtime evidence, not guesswork. Follow this workflow: (1) Explore relevant code and generate multiple concrete hypotheses about the root cause. (2) Add temporary, clearly marked instrumentation (e.g. comments like // CURSORJ_DEBUG) that appends structured one-line JSON or key=value log lines to the debug log file at {0}. If the runtime cannot write local files (browser, remote service), POST the same lines to {1}. Keep instrumentation minimal and reversible. (3) Stop and give the user exact reproduction steps; wait for them to reproduce before analyzing. (4) After reproduction, read the debug log file (and any terminal output) and identify the root cause from the captured runtime evidence. (5) Make a targeted fix that addresses that root cause—prefer a few lines over a broad rewrite. (6) After the user confirms the fix, remove all temporary instrumentation and restore the code. Prefer running reproduction through the terminal when possible so stdout/stderr is also available.
chat.debug.reproduced=I reproduced it
chat.debug.cleanup=Clean up
chat.debug.viewLogs=View logs
chat.debug.reproduced.prompt=I reproduced the issue. Read the debug log file and identify the root cause from the runtime evidence.
chat.debug.cleanup.prompt=Remove all temporary debugging instrumentation you added and restore the code.
chat.debug.viewLogs.missing=No debug log file found for this session yet. Send a Debug-mode prompt first.
